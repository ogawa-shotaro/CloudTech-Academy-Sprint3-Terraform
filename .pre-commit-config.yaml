# pre-commitフックのバージョン(rev)は、ツールチェーン自体の更新のため
# 定期的に `pre-commit autoupdate` で最新化すること。
# (Terraform provider等のIaC本体のバージョン方針は docs/05_development_guidelines.md 参照)
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/.checkov.yaml

  - repo: local
    hooks:
      - id: trivy-config
        name: Trivy (Dockerfile / IaC misconfiguration scan)
        entry: bash -c 'if command -v trivy >/dev/null 2>&1; then trivy config --exit-code 1 .; else echo "trivy未インストールのためスキップ"; fi'
        language: system
        pass_filenames: false
        files: (^|/)Dockerfile$|docker-compose.*\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
