framework:
  - terraform
compact: true
quiet: false
download-external-modules: false

skip-path:
  - .terraform/

# skip-check使用時のルール:
#   - 誤検知(false positive)であることを確認した場合のみ追加する
#   - 必ず「なぜスキップするか」の理由をコメントで残す
#
# 例:
# skip-check:
#   - CKV_AWS_XXX  # 理由: 開発環境専用でありNAT不要のため意図的にpublic subnetのみ構成

skip-check:
  # --- おみくじAPI(modules/alb, modules/asg-api)関連 ---
  # 要件上、ALBはインターネットからのHTTP(80番)アクセスを受け付ける仕様のため意図的に0.0.0.0/0を許可している。
  # なお本チェックはmodule.asg_api.aws_vpc_security_group_ingress_rule.from_alb(ALBのSGからの参照のみを許可し、
  # 0.0.0.0/0ではない)にも誤検知として出力される。checkovがaws_vpc_security_group_ingress_ruleの
  # referenced_security_group_idを正しく解釈できないための誤検知と判断。
  - CKV_AWS_260 # 理由: ALBは要件によりインターネットからのHTTP(80)を意図的に許可(下記詳細参照)。asg-api側は誤検知。
  # 要件のスコープはHTTP(80番)のみであり、HTTPS化(ACM証明書・443番リスナー・TLS設定)は本スプリントのスコープ外(docs/01_product_requirements.md参照)。
  - CKV_AWS_2 # 理由: 要件でHTTP(80)のみと明記されておりHTTPS化はスコープ外
  - CKV_AWS_103 # 理由: 同上。HTTPリスナーのみのためTLS設定は対象外
  - CKV_AWS_378 # 理由: 同上。ALB-APIサーバ間もHTTP(80)を使用する要件のため
  - CKV2_AWS_20 # 理由: 同上。HTTPS未導入のためHTTP→HTTPSリダイレクトは実施しない
  # dev/学習環境のため、コスト最適化・即時terraform destroy可能な状態を優先する。
  - CKV_AWS_91  # 理由: dev環境のためALBアクセスログ(S3送付)は未設定。本番導入時は再検討する
  - CKV_AWS_150 # 理由: dev環境のため削除保護を無効化し、即座にterraform destroyできるようにする
  - CKV2_AWS_28 # 理由: 学習/dev環境のスコープ外・コスト最適化のためWAFは未導入。本番導入時は再検討する
